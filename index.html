
 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Racing Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:2;pointer-events:none}
.panel{background:#111c2ddd;padding:10px 13px;border-radius:12px;font-weight:bold;box-shadow:0 3px 12px #0005}
#speed{color:#ffe36b;font-size:21px}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;z-index:3;background:#07152c66}
#card{background:#101a30ee;border:1px solid #ffffff44;border-radius:20px;padding:25px 22px;width:min(88%,350px);box-shadow:0 10px 35px #0007}
h1{color:#ffcc4d;margin:0 0 12px;font-size:27px}
p{line-height:1.5}
button{border:0;border-radius:14px;background:#ffcc4d;color:#182038;font-size:19px;font-weight:bold;padding:14px 22px;touch-action:manipulation}
#controls{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:2;pointer-events:none}
#controls button{pointer-events:auto;width:76px;height:65px;font-size:28px;background:#17223dcc;color:white;border:2px solid #ffffff99}
#gas{background:#ffcc4d!important;color:#17223d!important}
#hint{position:absolute;bottom:100px;width:100%;text-align:center;color:white;text-shadow:0 2px 4px #000;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <div class="panel">🏁 SCORE <span id="score">0</span></div>
  <div class="panel">⚡ <span id="speed">0</span> km/h</div>
</div>

<div id="message">
  <div id="card">
    <h1>🏎️ 3D RACING</h1>
    <p id="desc">Drive on the highway! Dodge traffic and beat your best score.</p>
    <button id="start">START RACE ▶</button>
  </div>
</div>

<div id="hint">Use ◀ ▶ to steer · Hold ⚡ to accelerate</div>
<div id="controls">
  <button id="left" aria-label="Steer left">◀</button>
  <button id="gas" aria-label="Accelerate">⚡</button>
  <button id="right" aria-label="Steer right">▶</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scoreEl=document.getElementById('score');
const speedEl=document.getElementById('speed');
const message=document.getElementById('message');
const card=document.getElementById('card');
const startBtn=document.getElementById('start');

let scene,camera,renderer,player;
let traffic=[],roadMarks=[],trees=[];
let running=false,steer=0,gas=false;
let score=0,speed=0,playerX=0,lastTime=0,spawnClock=0;
let best=0;

try{best=Number(localStorage.getItem('racing3DBest')||0)}catch(e){}

function makeMaterial(color,roughness=.7){
 return new THREE.MeshStandardMaterial({color,roughness});
}

function box(parent,w,h,d,color,x,y,z,material=null){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material||makeMaterial(color)
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

function makeCar(color,isPlayer=false){
 const group=new THREE.Group();
 const paint=makeMaterial(color,.32);
 box(group,1.65,.48,3.1,color,0,.66,0,paint);
 box(group,1.22,.58,1.45,color,0,1.12,-.25,paint);
 box(group,1.06,.40,.07,0x8fe8ff,0,1.18,.49);
 box(group,1.10,.34,.07,0x8fe8ff,0,1.18,-.99);

 for(const side of [-1,1]){
  for(const z of [-.95,.95]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.34,.34,.20,16),
    makeMaterial(0x17191e)
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(side*.83,.39,z);
   group.add(wheel);
  }
 }
 box(group,.38,.12,.05,0xffffff,-.48,.72,1.57);
 box(group,.38,.12,.05,0xffffff,.48,.72,1.57);
 box(group,.35,.12,.05,0xff2222,-.48,.72,-1.57);
 box(group,.35,.12,.05,0xff2222,.48,.72,-1.57);
 if(isPlayer){
  box(group,.45,.08,.45,0x222222,0,1.45,-.25);
 }
 group.position.y=.05;
 scene.add(group);
 return group;
}

function buildWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x91d6ff);
 scene.fog=new THREE.Fog(0x91d6ff,45,155);

 camera=new THREE.PerspectiveCamera(
  65,innerWidth/innerHeight,.1,250
 );
 camera.position.set(0,5.2,10.5);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xd9f2ff,0x52633b,2));

 const sun=new THREE.DirectionalLight(0xffffff,2.3);
 sun.position.set(-8,15,8);
 sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 scene.add(sun);

 const grass= new THREE.Mesh(
  new THREE.PlaneGeometry(400,400),
  makeMaterial(0x4b963f)
 );
 grass.rotation.x=-Math.PI/2;
 grass.position.set(0,-.09,-100);
 scene.add(grass);

 const road=new THREE.Mesh(
  new THREE.PlaneGeometry(12,300),
  makeMaterial(0x353a43,.95)
 );
 road.rotation.x=-Math.PI/2;
 road.position.set(0,0,-100);
 scene.add(road);

 for(const x of [-6,6]){
  const edge=new THREE.Mesh(
   new THREE.BoxGeometry(.18,.04,300),
   makeMaterial(0xfff2ce)
  );
  edge.position.set(x,.025,-100);
  scene.add(edge);
 }

 for(const x of [-2,2]){
  for(let i=0;i<18;i++){
   const mark=new THREE.Mesh(
    new THREE.BoxGeometry(.11,.035,3.2),
    makeMaterial(0xffffff)
   );
   mark.position.set(x,.035,-i*9);
   scene.add(mark);
   roadMarks.push(mark);
  }
 }

 for(let i=0;i<30;i++){
  for(const side of [-1,1]){
   const z=-i*7-5;
   const x=side*(10+Math.random()*12);
   const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.18,.27,1.5,7),
    makeMaterial(0x76502d)
   );
   trunk.position.set(x,.65,z);
   scene.add(trunk);
   const crown=new THREE.Mesh(
    new THREE.ConeGeometry(1.4+Math.random(),3.1,7),
    makeMaterial([0x27733b,0x328447,0x3e9145][i%3])
   );
   crown.position.set(x,2.8,z);
   scene.add(crown);
   trees.push({trunk,crown});
  }
 }

 player=makeCar(0xff303f,true);
 player.position.set(0,.05,4);
 camera.lookAt(0,1,-8);
}

function spawnTraffic(){
 const lanes=[-4,-2,0,2,4];
 const lane=lanes[Math.floor(Math.random()*lanes.length)];
 const colors=[0x208cff,0xffb52e,0xf1f1f1,0x39d69b,0xb66bff];
 const car=makeCar(colors[Math.floor(Math.random()*colors.length)]);
 car.position.set(lane,.05,-105);
 const trafficSpeed=12+Math.random()*9;
 traffic.push({car,lane,trafficSpeed});
}

function resetGame(){
 traffic.forEach(t=>scene.remove(t.car));
 traffic=[];
 score=0;speed=0;playerX=0;steer=0;gas=false;
 spawnClock=0;
 player.position.x=0;
 scoreEl.textContent='0';
 speedEl.textContent='0';
}

function endGame(){
 if(!running)return;
 running=false;
 gas=false;
 if(score>best){
  best=score;
  try{localStorage.setItem('racing3DBest',best)}catch(e){}
 }
 card.innerHTML=
  '<h1>💥 CRASH!</h1><p>Your score: <b>'+Math.floor(score)+
  '</b><br>Best score: <b>'+Math.floor(best)+
  '</b></p><button id="restart">RACE AGAIN ↻</button>';
 message.style.display='flex';
 document.getElementById('restart').onclick=startGame;
}

function startGame(){
 resetGame();
 running=true;
 message.style.display='none';
 lastTime=performance.now();
}

startBtn.onclick=startGame;

function holdButton(id,callback){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();callback(true);
 });
 el.addEventListener('pointerup',e=>{
  e.preventDefault();callback(false);
 });
 el.addEventListener('pointercancel',()=>callback(false));
 el.addEventListener('pointerleave',()=>callback(false));
}
holdButton('left',v=>{if(v)steer=-1;else if(steer===-1)steer=0});
holdButton('right',v=>{if(v)steer=1;else if(steer===1)steer=0});
holdButton('gas',v=>gas=v);

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')steer=-1;
 if(e.key==='ArrowRight'||e.key==='d')steer=1;
 if(e.key==='ArrowUp'||e.key===' ')gas=true;
});
addEventListener('keyup',e=>{
 if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))steer=0;
 if(e.key==='ArrowUp'||e.key===' ')gas=false;
});

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000||0,.045);
 lastTime=now;

 if(running){
  speed+=(gas?24:9)*dt;
  speed=Math.min(speed,gas?145:95);
  score+=speed*dt*.12;
  scoreEl.textContent=Math.floor(score);
  speedEl.textContent=Math.floor(speed);

  playerX+=steer*dt*(3.8+speed*.018);
  playerX=Math.max(-4.7,Math.min(4.7,playerX));
  player.position.x+=(playerX-player.position.x)*Math.min(1,dt*8);
  player.rotation.z=-steer*.055;

  const worldMove=speed*.23*dt;
  roadMarks.forEach(m=>{
   m.position.z+=worldMove;
   if(m.position.z>10)m.position.z-=162;
  });

  trees.forEach(t=>{
   t.trunk.position.z+=worldMove;
   t.crown.position.z+=worldMove;
   if(t.trunk.position.z>12){
    const z=-190+Math.random()*-5;
    const x=Math.sign(t.trunk.position.x)*(10+Math.random()*12);
    t.trunk.position.set(x,.65,z);
    t.crown.position.set(x,2.8,z);
   }
  });

  spawnClock+=dt;
  if(spawnClock>Math.max(.65,1.65-speed/180)){
   spawnClock=0;
   spawnTraffic();
  }

  for(let i=traffic.length-1;i>=0;i--){
   const t=traffic[i];
   t.car.position.z+= (worldMove+t.trafficSpeed*dt);
   if(t.car.position.z>13){
    scene.remove(t.car);
    traffic.splice(i,1);
    continue;
   }
   const dx=Math.abs(t.car.position.x-player.position.x);
   const dz=Math.abs(t.car.position.z-player.position.z);
   if(dx<1.45&&dz<2.45){endGame();break}
  }
 }

 camera.position.x+=(player.position.x*.36-camera.position.x)*.045;
 camera.position.y=5.2;
 camera.position.z=10.5;
 camera.lookAt(player.position.x*.55,1,-9);
 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

try{
 buildWorld();
 requestAnimationFrame(animate);
}catch(e){
 document.getElementById('desc').textContent=
 '3D game could not load. Check your internet connection and refresh.';
}
</script>
</body>
</html>
