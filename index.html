
  
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Racing Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8bc9ef;font-family:Arial,sans-serif;color:white;touch-action:none}
canvas{display:block}
button{background:#102438e8;color:white;border:1px solid #8ce8ff;border-radius:12px;padding:10px;font-weight:bold;touch-action:none}
button:active,.active{background:#008bc7}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.panel{background:#101c2ddd;padding:8px 11px;border-radius:12px;line-height:1.5;font-size:13px}
#views{position:fixed;right:8px;top:82px;display:grid;gap:6px;z-index:3}
#audioButtons{position:fixed;right:8px;top:176px;display:grid;gap:6px;z-index:3}
#controls{position:fixed;bottom:15px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:end;z-index:3}
.group{display:flex;gap:7px}
.round{width:55px;height:55px;border-radius:50%;font-size:22px;padding:4px}
.pedal{width:62px;height:62px}
#brake{background:#a52330;border-color:#ffb6b6}
#gas{background:#087b39;border-color:#aaffbd}
#screen{position:fixed;inset:0;display:grid;place-items:center;background:#07152566;text-align:center;z-index:5}
#message{background:#101c2df2;padding:22px;border-radius:18px;max-width:90%;box-shadow:0 8px 35px #0008}
#start{background:#00b9e9;color:#07121c;padding:15px 26px;font-size:18px}
@media(max-width:420px){
 #views button,#audioButtons button{font-size:11px;padding:8px 6px}
 .round{width:49px;height:49px}.pedal{width:55px;height:59px}
 .panel{padding:7px;font-size:12px}
}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">
  SCORE <b id="score">0</b><br>
  BEST <b id="best">0</b><br>
  🪙 COINS <b id="coinsCount">0</b>
 </div>
 <div class="panel" id="speedPanel">
  SPEED<br><b id="speed" style="font-size:23px">0</b> km/h
 </div>
</div>

<div id="views">
 <button id="outside" class="active">🚘 Outside View</button>
 <button id="inside">👁 Inside View</button>
</div>

<div id="audioButtons">
 <button id="musicBtn">🎵 Music ON</button>
 <button id="soundBtn">🔊 Sound ON</button>
</div>

<div id="controls">
 <div class="group">
  <button class="round" id="left">◀</button>
  <button class="round" id="right">▶</button>
 </div>
 <div class="group">
  <button class="pedal" id="brake">🛑<br>BRAKE</button>
  <button class="pedal" id="gas">▲<br>GAS</button>
 </div>
</div>

<div id="screen">
 <div id="message">
  <h1>🏁 3D RACING</h1>
  <p>Highway • Traffic • Coins • Smoke</p>
  <p id="status">Loading 3D car...</p>
  <button id="start">START RACE ▶</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9f1);
scene.fog=new THREE.Fog(0x91c9f1,75,290);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,800);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe7f5ff,0x526047,2.1));
const sun=new THREE.DirectionalLight(0xffedcf,3);
sun.position.set(-30,50,25);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

function mat(color,rough=.75,metal=0){
 return new THREE.MeshStandardMaterial({
  color,roughness:rough,metalness:metal
 });
}
function box(parent,w,h,d,color,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

/* HIGHWAY */
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(800,800),mat(0x548748)
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.15,-190);
scene.add(ground);
box(scene,13,.12,700,0x30343a,0,-.04,-200);

const roadMarks=[];
for(let z=-540;z<100;z+=11){
 for(const x of [-6.25,0,6.25]){
  roadMarks.push(box(scene,.13,.025,4.5,0xf4f4ee,x,.04,z));
 }
}
for(const x of [-7.2,7.2]){
 box(scene,.15,.45,700,0xc4d0d7,x,.3,-200);
 for(let z=-530;z<100;z+=15){
  box(scene,.12,.6,.15,0xe2e8eb,x,.1,z);
 }
}

/* MOUNTAINS */
for(const side of [-1,1]){
 for(let i=0;i<20;i++){
  const h=14+Math.random()*25;
  const m=new THREE.Mesh(
   new THREE.ConeGeometry(12+Math.random()*12,h,5),
   mat(0x718a9a)
  );
  m.position.set(side*(25+Math.random()*45),h/2-1,-40-i*29);
  scene.add(m);
 }
}

/* TREES */
const trees=[];
for(let z=-530;z<100;z+=10){
 for(const side of [-1,1]){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(
   new THREE.CylinderGeometry(.15,.23,1.4,7),mat(0x62462d)
  );
  trunk.position.y=.7;
  g.add(trunk);
  for(let j=0;j<3;j++){
   const leaf=new THREE.Mesh(
    new THREE.ConeGeometry(1.2-j*.2,2.2,7),
    mat(j===1?0x337847:0x205b38)
   );
   leaf.position.y=1.3+j*.85;
   leaf.castShadow=true;
   g.add(leaf);
  }
  g.position.set(side*(10+Math.random()*8),0,z+Math.random()*4);
  g.scale.setScalar(.7+Math.random()*.65);
  scene.add(g);
  trees.push(g);
 }
}

/* PLAYER CAR */
const player=new THREE.Group();
scene.add(player);

function backupCar(){
 const body=box(player,1.85,.52,3.7,0x0875ed,0,.65,0);
 body.material=mat(0x0875ed,.24,.45);
 box(player,1.42,.6,1.75,0x172d42,0,1.08,-.2);
 box(player,1.55,.12,1.9,0x0875ed,0,1.4,-.2);

 for(const x of [-.96,.96]){
  for(const z of [-1.15,1.15]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.36,.36,.23,20),mat(0x101114)
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.4,z);
   player.add(wheel);
   const hub=new THREE.Mesh(
    new THREE.CylinderGeometry(.16,.16,.24,16),mat(0xcbd6dd,.25,.8)
   );
   hub.rotation.z=Math.PI/2;
   hub.position.set(x,.4,z);
   player.add(hub);
  }
 }
 for(const x of [-.58,.58]){
  box(player,.35,.13,.06,0xfff4c9,x,.72,-1.88);
  box(player,.35,.13,.06,0xff1525,x,.72,1.88);
 }
 box(player,1.5,.2,.48,0x141c25,0,.87,-.55);
 const steering=new THREE.Mesh(
  new THREE.TorusGeometry(.29,.045,10,28),mat(0x15191d,.4,.3)
 );
 steering.position.set(0,1,-.83);
 player.add(steering);
}
backupCar();

const loader=new GLTFLoader();
loader.load(
 'https://threejs.org/examples/models/gltf/f1/scene.gltf',
 gltf=>{
  while(player.children.length)player.remove(player.children[0]);
  const car=gltf.scene;
  car.scale.setScalar(.85);
  car.rotation.y=Math.PI;
  car.position.y=.05;
  car.traverse(o=>{
   if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}
  });
  player.add(car);
  document.getElementById('status').textContent='3D car ready!';
 },
 undefined,
 ()=>{
  document.getElementById('status').textContent='Backup car ready!';
 }
);
player.position.set(0,0,2);

/* GAME STATE */
let running=false,paused=false,speed=0,score=0;
let best=0;
try{best=Number(localStorage.getItem('realRacingBest')||0)}catch(e){}
document.getElementById('best').textContent=best;

/* SOUND AND BACKGROUND MUSIC */
let audioCtx=null,musicOn=true,soundOn=true;
let musicTimer=null,musicNote=0;

function getAudio(){
 if(!audioCtx){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 }
 if(audioCtx.state==='suspended')audioCtx.resume();
 return audioCtx;
}
function tone(freq,duration=.15,volume=.07,type='sine'){
 if(!soundOn)return;
 try{
  const a=getAudio();
  const osc=a.createOscillator();
  const gain=a.createGain();
  osc.type=type;
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(volume,a.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);
  osc.connect(gain);
  gain.connect(a.destination);
  osc.start();
  osc.stop(a.currentTime+duration);
 }catch(e){}
}
function startMusic(){
 if(musicTimer)clearInterval(musicTimer);
 if(!musicOn)return;
 const melody=[262,330,392,330,294,349,440,349,
                262,330,392,523,440,392,330,294];
 musicTimer=setInterval(()=>{
  if(running&&!paused&&musicOn){
   try{
    const a=getAudio();
    const osc=a.createOscillator();
    const gain=a.createGain();
    osc.type='triangle';
    osc.frequency.value=melody[musicNote++%melody.length];
    gain.gain.value=.025;
    gain.gain.setTargetAtTime(.001,a.currentTime+.12,.08);
    osc.connect(gain);
    gain.connect(a.destination);
    osc.start();
    osc.stop(a.currentTime+.24);
   }catch(e){}
  }
 },260);
}
document.getElementById('musicBtn').onclick=()=>{
 musicOn=!musicOn;
 document.getElementById('musicBtn').textContent=
  musicOn?'🎵 Music ON':'🎵 Music OFF';
 if(musicOn){getAudio();startMusic();}
 else if(musicTimer)clearInterval(musicTimer);
};
document.getElementById('soundBtn').onclick=()=>{
 soundOn=!soundOn;
 document.getElementById('soundBtn').textContent=
  soundOn?'🔊 Sound ON':'🔇 Sound OFF';
 if(soundOn)tone(700,.12);
};

/* TRAFFIC */
const traffic=[];
function makeTraffic(color){
 const g=new THREE.Group();
 box(g,1.65,.55,3.1,color,0,.6,0);
 box(g,1.27,.52,1.55,0x263c50,0,1,-.15);
 for(const x of [-.84,.84]){
  for(const z of [-1,1]){
   const w=new THREE.Mesh(
    new THREE.CylinderGeometry(.31,.31,.2,14),mat(0x111111)
   );
   w.rotation.z=Math.PI/2;
   w.position.set(x,.34,z);
   g.add(w);
  }
 }
 scene.add(g);
 return g;
}
const trafficColors=[0xf1f2f4,0xc51f32,0x161b25,0xe1a32b,0x128779];
for(let i=0;i<8;i++){
 const c=makeTraffic(trafficColors[i%trafficColors.length]);
 c.position.set([-4.3,-2.15,2.15,4.3][i%4],0,-35-i*36);
 traffic.push(c);
}

/* GOLD COINS */
const coins=[];
let totalCoins=0;
try{
 totalCoins=Number(localStorage.getItem('racingAdventureCoins')||0);
}catch(e){}
document.getElementById('coinsCount').textContent=totalCoins;

function makeCoin(){
 const coin=new THREE.Mesh(
  new THREE.CylinderGeometry(.43,.43,.12,28),
  new THREE.MeshStandardMaterial({
   color:0xffc400,metalness:.85,roughness:.2,emissive:0x704600
  })
 );
 coin.rotation.x=Math.PI/2;
 coin.position.y=1.1;
 scene.add(coin);
 return coin;
}
for(let i=0;i<12;i++){
 const coin=makeCoin();
 coin.position.set([-4.3,-2.15,2.15,4.3][i%4],1.1,-25-i*31);
 coins.push(coin);
}
function collectCoins(movement){
 for(const coin of coins){
  coin.rotation.y+=.07;
  coin.rotation.z+=.025;
  coin.position.z+=movement;
  if(coin.position.z>10){
   coin.position.z=-230-Math.random()*130;
   coin.position.x=[-4.3,-2.15,2.15,4.3][Math.floor(Math.random()*4)];
  }
  if(Math.abs(coin.position.z-player.position.z)<2.2&&
     Math.abs(coin.position.x-player.position.x)<1.45){
   totalCoins++;
   score+=100;
   document.getElementById('coinsCount').textContent=totalCoins;
   try{localStorage.setItem('racingAdventureCoins',totalCoins)}catch(e){}
   tone(880,.12,.09);
   tone(1175,.18,.07);
   coin.position.z=-230-Math.random()*130;
   coin.position.x=[-4.3,-2.15,2.15,4.3][Math.floor(Math.random()*4)];
  }
 }
}

/* BRAKE SMOKE PARTICLES */
const smoke=[];
function makeSmoke(){
 const puff=new THREE.Mesh(
  new THREE.SphereGeometry(.16,8,8),
  new THREE.MeshBasicMaterial({
   color:0xcbd0d5,transparent:true,opacity:.55,depthWrite:false
  })
 );
 scene.add(puff);
 puff.visible=false;
 smoke.push({mesh:puff,life:0});
}
for(let i=0;i<42;i++)makeSmoke();

let smokeIndex=0,wasBraking=false;
function emitSmoke(){
 for(const side of [-1,1]){
  const p=smoke[smokeIndex++%smoke.length];
  p.mesh.visible=true;
  p.life=.65;
  p.mesh.position.set(
   player.position.x+side*.85,.28,player.position.z+1.25
  );
  p.mesh.scale.setScalar(.65+Math.random()*.5);
  p.mesh.material.opacity=.52;
 }
}
function updateSmoke(dt){
 for(const p of smoke){
  if(p.life>0){
   p.life-=dt;
   p.mesh.position.y+=dt*1.25;
   p.mesh.position.x+=(Math.random()-.5)*dt*1.4;
   p.mesh.scale.multiplyScalar(1+dt*1.7);
   p.mesh.material.opacity=Math.max(0,p.life*.9);
   if(p.life<=0)p.mesh.visible=false;
  }
 }
}

/* CAMERA VIEWS */
let view='outside';
function setView(v){
 view=v;
 document.getElementById('outside').classList.toggle('active',v==='outside');
 document.getElementById('inside').classList.toggle('active',v==='inside');
}
document.getElementById('outside').onclick=()=>setView('outside');
document.getElementById('inside').onclick=()=>setView('inside');

/* MOBILE BUTTONS */
let left=false,right=false,gas=false,brake=false;
function hold(id,set){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  set(true);
  try{el.setPointerCapture(e.pointerId)}catch(_){}
 });
 for(const event of ['pointerup','pointercancel','lostpointercapture']){
  el.addEventListener(event,e=>{
   e.preventDefault();
   set(false);
  });
 }
}
hold('left',v=>left=v);
hold('right',v=>right=v);
hold('gas',v=>gas=v);
hold('brake',v=>brake=v);

/* START GAME */
document.getElementById('start').onclick=()=>{
 getAudio();
 startMusic();
 tone(520,.2,.08);
 running=true;
 paused=false;
 speed=30;
 score=0;
 player.position.x=0;
 document.getElementById('screen').style.display='none';
};

/* PAUSE: TAP SPEED PANEL */
document.getElementById('speedPanel').style.pointerEvents='auto';
document.getElementById('speedPanel').onclick=()=>{
 if(!running)return;
 paused=!paused;
 if(paused){
  document.getElementById('screen').style.display='grid';
  document.getElementById('message').innerHTML=
   '<h1>PAUSED</h1><button id="resume">RESUME ▶</button>';
  document.getElementById('resume').onclick=()=>{
   paused=false;
   document.getElementById('screen').style.display='none';
  };
 }else{
  document.getElementById('screen').style.display='none';
 }
};

/* CRASH */
function crash(){
 tone(110,.5,.12,'sawtooth');
 running=false;
 speed=0;
 best=Math.max(best,Math.floor(score));
 try{localStorage.setItem('realRacingBest',best)}catch(e){}
 document.getElementById('best').textContent=best;
 document.getElementById('message').innerHTML=
  '<h1>🏁 RACE OVER</h1><p>Score: '+Math.floor(score)+
  ' | Best: '+best+'</p><button id="again">RACE AGAIN ↻</button>';
 document.getElementById('screen').style.display='grid';
 document.getElementById('again').onclick=()=>{
  score=0;
  speed=25;
  player.position.x=0;
  traffic.forEach((c,i)=>{c.position.z=-40-i*37});
  coins.forEach((c,i)=>{c.position.z=-25-i*31});
  running=true;
  paused=false;
  document.getElementById('screen').style.display='none';
 };
}

/* CAMERA FOLLOW */
function updateCamera(){
 if(view==='outside'){
  const desired=new THREE.Vector3(
   player.position.x*.65,4.6,player.position.z+9
  );
  camera.position.lerp(desired,.09);
  camera.lookAt(player.position.x,1.1,player.position.z-2);
  camera.fov=67;
 }else{
  const desired=new THREE.Vector3(
   player.position.x,1.48,player.position.z-.2
  );
  camera.position.lerp(desired,.18);
  camera.lookAt(player.position.x,1.4,player.position.z-28);
  camera.fov=78;
 }
 camera.updateProjectionMatrix();
}

/* MAIN GAME LOOP */
let previous=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 if(running&&!paused){
  if(gas)speed=Math.min(speed+40*dt,230);
  else speed=Math.max(speed-5*dt,65);

  if(brake){
   speed=Math.max(0,speed-210*dt);
   if(!wasBraking&&speed>25){
    emitSmoke();
    tone(180,.12,.04,'sawtooth');
   }
   if(speed>10&&Math.random()<.75)emitSmoke();
  }
  wasBraking=brake;

  const direction=(right?1:0)-(left?1:0);
  player.position.x+=direction*(3+speed*.012)*dt;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-5.2,5.2);
  player.rotation.z=THREE.MathUtils.lerp(
   player.rotation.z,-direction*.06,.12
  );

  const movement=speed*dt*.48;
  score+=movement*.2;
  collectCoins(movement);

  roadMarks.forEach(o=>{
   o.position.z+=movement;
   if(o.position.z>12)o.position.z-=640;
  });
  trees.forEach(t=>{
   t.position.z+=movement;
   if(t.position.z>15)t.position.z-=630;
  });

  for(const c of traffic){
   c.position.z+=movement*(.75+speed/250);
   if(c.position.z>8){
    c.position.z=-220-Math.random()*120;
    c.position.x=[-4.3,-2.15,2.15,4.3][Math.floor(Math.random()*4)];
   }
   if(Math.abs(c.position.z-player.position.z)<2.2&&
      Math.abs(c.position.x-player.position.x)<1.45){
    crash();
    break;
   }
  }
 }
 updateSmoke(dt);
 document.getElementById('score').textContent=Math.floor(score);
 document.getElementById('speed').textContent=Math.floor(speed);
 updateCamera();
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
