

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Racing Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#83c9ff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;z-index:5}
.panel{background:#101827dd;color:white;padding:10px 13px;border:1px solid #ffffff40;border-radius:13px;font-weight:bold;font-size:13px;box-shadow:0 4px 12px #0003}
.value{color:#ffd83d;font-size:18px;margin-top:4px}
#topButtons{position:fixed;top:86px;left:12px;display:flex;gap:7px;z-index:6}
button{border:0;color:white;font-weight:bold;border-radius:12px;padding:12px 14px;background:#162338e8;box-shadow:0 4px 9px #0004;font-size:12px;touch-action:none}
button:active{filter:brightness(1.4);transform:scale(.97)}
#controls{position:fixed;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;z-index:6}
#steerArea{width:124px;height:124px;position:relative;display:flex;align-items:center;justify-content:center}
#steering{width:112px;height:112px;border:10px solid #20252d;border-radius:50%;background:#2229;box-shadow:inset 0 0 0 3px #89919b,0 4px 12px #0005;position:relative;touch-action:none}
#steering:before{content:"";position:absolute;width:8px;height:45px;background:#e8edf4;left:42px;top:2px;border-radius:6px}
#steering:after{content:"";position:absolute;width:74px;height:8px;background:#e8edf4;left:9px;top:42px;border-radius:6px}
#hub{position:absolute;width:24px;height:24px;border-radius:50%;background:#ffb52e;border:4px solid #313843;left:34px;top:34px;z-index:2}
#pedals{display:flex;gap:10px;align-items:end}
.pedal{width:78px;height:94px;font-size:15px;border-radius:16px;border:2px solid #ffffff80;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
#gas{background:linear-gradient(#23bf63,#087a3a)}
#brake{background:linear-gradient(#ff5d56,#ad1717)}
.pedal span{font-size:25px}
#hint{position:fixed;bottom:148px;left:50%;transform:translateX(-50%);color:white;background:#101827bb;padding:8px 12px;border-radius:10px;font-size:12px;white-space:nowrap;z-index:4}
#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06101bc9;color:white;text-align:center;z-index:20;padding:25px}
#message .box{max-width:360px;background:#17243a;border:1px solid #ffffff44;border-radius:22px;padding:25px;box-shadow:0 15px 45px #0007}
#message h1{margin:0 0 12px;color:#ffd83d}
#start{background:#20b960;font-size:17px;padding:15px 28px;margin-top:10px}
@media(max-width:380px){.panel{padding:8px;font-size:11px}.value{font-size:16px}#steerArea{width:105px;height:105px}#steering{width:96px;height:96px;border-width:8px}#steering:before{left:36px;height:38px}#steering:after{top:36px;left:7px;width:66px}#hub{left:28px;top:28px} .pedal{width:66px;height:84px}}
</style>
</head>
<body>

<div id="hud">
  <div class="panel">SPEED<div class="value"><span id="speed">0</span> km/h</div></div>
  <div class="panel">COINS<div class="value">🪙 <span id="coins">0</span></div></div>
  <div class="panel">SCORE<div class="value" id="score">0</div></div>
</div>

<div id="topButtons">
  <button id="viewBtn">👀 OUTSIDE VIEW</button>
  <button id="soundBtn">🔊 SOUND: ON</button>
</div>

<div id="hint">Hold GAS to drive • Turn steering to move</div>

<div id="controls">
  <div id="steerArea">
    <div id="steering"><div id="hub"></div></div>
  </div>
  <div id="pedals">
    <button class="pedal" id="brake"><span>💨</span>BRAKE</button>
    <button class="pedal" id="gas"><span>🏁</span>GAS</button>
  </div>
</div>

<div id="message">
  <div class="box">
    <h1>🏎️ RACING ADVENTURE</h1>
    <p>Collect coins, race on the road and test your driving skills!</p>
    <p>🪙 Collect coins<br>💨 Brake to release smoke<br>🔊 Turn on engine sound<br>👀 Switch camera views</p>
    <button id="start">START RACING ▶</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x83c9ff);
scene.fog = new THREE.Fog(0x83c9ff, 90, 260);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf6ff,0x51603b,2.1));
const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-8,18,8);
sun.castShadow=true;
scene.add(sun);

function material(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const roadMat=material(0x343941,.95);
const grassMat=material(0x459b42);
const lineMat=material(0xffffff);
const yellowMat=material(0xffd82f,.35,.25);
const blackMat=material(0x15191f);
const glassMat=new THREE.MeshStandardMaterial({color:0x64c9ed,metalness:.15,roughness:.22});
const redMat=material(0xd7192d,.28,.25);
const whiteMat=material(0xffffff,.3,.15);

// Ground and road
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.13,-100);
ground.receiveShadow=true;
scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(12,420),roadMat);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.06,-150);
road.receiveShadow=true;
scene.add(road);

// Road edges
for(const x of [-5.6,5.6]){
 const edge=new THREE.Mesh(new THREE.BoxGeometry(.15,.035,420),lineMat);
 edge.position.set(x,.01,-150);
 scene.add(edge);
}

// Moving road dashes
const dashes=[];
for(let i=0;i<32;i++){
 const dash=new THREE.Mesh(new THREE.BoxGeometry(.13,.035,3.2),lineMat);
 dash.position.set(0,.015,-i*12-5);
 scene.add(dash);
 dashes.push(dash);
}

// Roadside trees, poles and scenery
const scenery=[];
const trunkMat=material(0x75502c);
const leafMat=material(0x176b35);
for(let i=0;i<52;i++){
 for(const side of [-1,1]){
  const z=-i*8-10;
  const x=side*(8+Math.random()*8);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,1.7,7),trunkMat);
  trunk.position.set(x,.8,z);
  scene.add(trunk);
  const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.15,3.2,8),leafMat);
  leaves.position.set(x,2.9,z);
  leaves.castShadow=true;
  scene.add(leaves);
  scenery.push({parts:[trunk,leaves],z});
 }
}

// Build the player's car
const car=new THREE.Group();
scene.add(car);
car.position.set(0,0,3);

const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.58,3.65),redMat);
body.position.y=.68;
body.castShadow=true;
car.add(body);

const hood=new THREE.Mesh(new THREE.BoxGeometry(1.75,.22,1.0),redMat);
hood.position.set(0,.98,-1.05);
car.add(hood);

const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.48,.72,1.65),glassMat);
cabin.position.set(0,1.25,.15);
cabin.castShadow=true;
car.add(cabin);

const roof=new THREE.Mesh(new THREE.BoxGeometry(1.43,.13,1.15),redMat);
roof.position.set(0,1.66,.12);
car.add(roof);

// Front and rear lights
for(const x of [-.65,.65]){
 const head=new THREE.Mesh(new THREE.BoxGeometry(.38,.16,.08),whiteMat);
 head.position.set(x,.86,-1.84);
 car.add(head);
 const tail=new THREE.Mesh(new THREE.BoxGeometry(.32,.15,.08),material(0xff1717));
 tail.position.set(x,.82,1.84);
 car.add(tail);
}

// Wheels
const wheels=[];
for(const x of [-1,1]){
 for(const z of [-1.15,1.18]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.25,20),blackMat);
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.39,z);
  wheel.castShadow=true;
  car.add(wheel);
  wheels.push(wheel);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.27,16),material(0xc8cdd3,.3,.65));
  hub.rotation.z=Math.PI/2;
  hub.position.set(x,.39,z);
  car.add(hub);
 }
}

// Coins: flat rings facing the camera
const coins=[];
const coinMat=new THREE.MeshStandardMaterial({
 color:0xffd21f,metalness:.75,roughness:.2,
 emissive:0x805500,emissiveIntensity:.25
});
const coinGeo=new THREE.TorusGeometry(.52,.17,12,28);

function spawnCoin(z){
 const group=new THREE.Group();
 const ring=new THREE.Mesh(coinGeo,coinMat);
 ring.rotation.x=0;
 group.add(ring);
 const center=new THREE.Mesh(
  new THREE.CylinderGeometry(.21,.21,.09,20),
  yellowMat
 );
 center.rotation.x=Math.PI/2;
 group.add(center);
 group.position.set((Math.floor(Math.random()*3)-1)*3,1.45,z);
 group.userData.active=true;
 scene.add(group);
 coins.push(group);
}
for(let i=0;i<24;i++)spawnCoin(-16-i*11);

// Smoke particles
const smoke=[];
const smokeMat=new THREE.MeshBasicMaterial({
 color:0xc8d0d8,transparent:true,opacity:.65,depthWrite:false
});
function emitSmoke(){
 for(let i=0;i<3;i++){
  const puff=new THREE.Mesh(
   new THREE.SphereGeometry(.22+Math.random()*.18,10,10),
   smokeMat.clone()
  );
  puff.position.set(
   car.position.x+(Math.random()-.5)*1.6,
   .35+Math.random()*.25,
   car.position.z+1.35
  );
  puff.userData.life=1.0;
  puff.userData.drift=(Math.random()-.5)*1.3;
  scene.add(puff);
  smoke.push(puff);
 }
}

// Driving state
let speed=0,coinCount=0,score=0;
let gas=false,brake=false,steer=0;
let insideView=false,started=false;
let soundOn=true,lastBrake=false;
let previousTime=performance.now();

// Sound system
let audio=null,master=null,engineOsc=null,engineGain=null;
function startAudio(){
 if(audio){
  if(audio.state==='suspended')audio.resume();
  return;
 }
 try{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain();
  master.gain.value=soundOn?.45:0;
  master.connect(audio.destination);
  engineOsc=audio.createOscillator();
  engineGain=audio.createGain();
  engineOsc.type='sawtooth';
  engineOsc.frequency.value=55;
  engineGain.gain.value=.015;
  engineOsc.connect(engineGain);
  engineGain.connect(master);
  engineOsc.start();
 }catch(e){}
}
function tone(freq,duration=.12,volume=.25,type='sine'){
 if(!soundOn)return;
 startAudio();
 if(!audio||!master)return;
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type=type;
 osc.frequency.setValueAtTime(freq,audio.currentTime);
 gain.gain.setValueAtTime(volume,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 osc.connect(gain);
 gain.connect(master);
 osc.start();
 osc.stop(audio.currentTime+duration);
}

// Touch-friendly hold buttons
function holdButton(id,onDown,onUp){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  onDown();
 });
 const release=e=>{onUp();};
 el.addEventListener('pointerup',release);
 el.addEventListener('pointercancel',release);
 el.addEventListener('lostpointercapture',release);
}
holdButton('gas',()=>{gas=true;startAudio();},()=>gas=false);
holdButton('brake',()=>{brake=true;startAudio();},()=>brake=false);

// Steering wheel control: drag left/right
const steering=document.getElementById('steering');
let steerPointer=null,lastPointerX=0;
steering.addEventListener('pointerdown',e=>{
 e.preventDefault();
 steerPointer=e.pointerId;
 lastPointerX=e.clientX;
 steering.setPointerCapture(e.pointerId);
 startAudio();
});
steering.addEventListener('pointermove',e=>{
 if(steerPointer!==e.pointerId)return;
 const dx=e.clientX-lastPointerX;
 lastPointerX=e.clientX;
 steer=THREE.MathUtils.clamp(steer+dx*.012,-1,1);
 steering.style.transform=`rotate(${steer*120}deg)`;
});
function endSteering(e){
 if(steerPointer!==e.pointerId)return;
 steerPointer=null;
}
steering.addEventListener('pointerup',endSteering);
steering.addEventListener('pointercancel',endSteering);
steering.addEventListener('lostpointercapture',endSteering);

// Keyboard support
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
 startAudio();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{gas=false;brake=false;for(const k in keys)keys[k]=false;});

document.getElementById('viewBtn').addEventListener('click',()=>{
 insideView=!insideView;
 document.getElementById('viewBtn').textContent=insideView?'👀 INSIDE VIEW':'👀 OUTSIDE VIEW';
});
document.getElementById('soundBtn').addEventListener('click',()=>{
 soundOn=!soundOn;
 document.getElementById('soundBtn').textContent=soundOn?'🔊 SOUND: ON':'🔇 SOUND: OFF';
 if(soundOn)startAudio();
 if(master)master.gain.setTargetAtTime(soundOn?.45:0,audio.currentTime,.05);
});

document.getElementById('start').addEventListener('click',()=>{
 document.getElementById('message').style.display='none';
 started=true;
 startAudio();
});

// Main game loop
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previousTime)/1000,.04);
 previousTime=now;

 if(started){
  const gasPressed=gas||keys['arrowup']||keys['w'];
  const brakePressed=brake||keys['arrowdown']||keys['s'];
  const left=keys['arrowleft']||keys['a'];
  const right=keys['arrowright']||keys['d'];

  if(left)steer=Math.max(-1,steer-dt*1.8);
  if(right)steer=Math.min(1,steer+dt*1.8);
  if(!steerPointer&&!left&&!right){
   steer*=Math.max(0,1-dt*1.3);
   if(Math.abs(steer)<.015)steer=0;
  }
  steering.style.transform=`rotate(${steer*120}deg)`;

  if(gasPressed)speed=Math.min(180,speed+48*dt);
  else speed=Math.max(0,speed-8*dt);

  if(brakePressed){
   speed=Math.max(0,speed-105*dt);
   if(!lastBrake){
    emitSmoke();
    tone(125,.22,.2,'sawtooth');
   }
   if(speed>1&&Math.random()<.8)emitSmoke();
  }
  lastBrake=brakePressed;

  // Move the car sideways with steering
  car.position.x+=steer*speed*.012*dt;
  car.position.x=THREE.MathUtils.clamp(car.position.x,-4.3,4.3);
  car.rotation.y=-steer*.12;
  car.rotation.z=-steer*.035;
  wheels.forEach(w=>w.rotation.x+=speed*dt*.055);

  // Road scroll
  const move=speed*.14*dt;
  dashes.forEach(d=>{
   d.position.z+=move;
   if(d.position.z>8)d.position.z-=384;
  });
  scenery.forEach(s=>{
   s.z+=move;
   s.parts.forEach(p=>p.position.z+=move);
   if(s.z>10){
    s.z-=416;
    s.parts.forEach(p=>{
     p.position.x=Math.sign(p.position.x)*(8+Math.random()*8);
    });
   }
  });

  // Coin collection
  for(const c of coins){
   c.position.z+=move;
   c.rotation.y+=dt*1.8;
   c.rotation.z+=dt*1.1;
   if(c.position.z>car.position.z-1.0 &&
      c.position.z<car.position.z+1.5 &&
      Math.abs(c.position.x-car.position.x)<1.45 &&
      c.userData.active){
    c.userData.active=false;
    coinCount++;
    score+=100;
    document.getElementById('coins').textContent=coinCount;
    document.getElementById('score').textContent=score;
    tone(880,.12,.18);
    setTimeout(()=>tone(1175,.16,.14),80);
    c.position.z=-230-Math.random()*50;
    c.position.x=(Math.floor(Math.random()*3)-1)*3;
    c.userData.active=true;
   }
   if(c.position.z>12){
    c.position.z=-220-Math.random()*40;
    c.position.x=(Math.floor(Math.random()*3)-1)*3;
   }
  }

  // Smoke particles grow and fade
  for(let i=smoke.length-1;i>=0;i--){
   const p=smoke[i];
   p.userData.life-=dt*1.3;
   p.position.y+=dt*.65;
   p.position.x+=p.userData.drift*dt;
   p.scale.multiplyScalar(1+dt*.9);
   p.material.opacity=Math.max(0,p.userData.life*.6);
   if(p.userData.life<=0){
    scene.remove(p);
    p.geometry.dispose();
    p.material.dispose();
    smoke.splice(i,1);
   }
  }

  if(engineOsc&&audio&&soundOn){
   engineOsc.frequency.setTargetAtTime(45+speed*1.4,audio.currentTime,.08);
   engineGain.gain.setTargetAtTime(.012+speed*.00022,audio.currentTime,.1);
  }
  document.getElementById('speed').textContent=Math.round(speed);
  score+=Math.round(speed*dt*.08);
  document.getElementById('score').textContent=score;
 }

 // Camera: outside chase view or inside cockpit view
 const target=new THREE.Vector3(car.position.x,0,car.position.z-8);
 if(insideView){
  camera.position.set(car.position.x,1.58,car.position.z+.15);
  camera.lookAt(car.position.x,1.5,car.position.z-30);
 }else{
  const desired=new THREE.Vector3(car.position.x,5.1,car.position.z+9.5);
  camera.position.lerp(desired,.09);
  camera.lookAt(target.x,.8,target.z);
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
