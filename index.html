


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Car Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#83c9ff;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.box{background:#111d30df;color:white;border:1px solid #ffffff50;padding:10px 13px;border-radius:12px;font-size:13px;font-weight:bold}
.val{color:#ffdf43;font-size:18px;margin-top:4px}
#top{position:fixed;top:78px;left:12px;display:flex;gap:8px;z-index:4}
button{border:0;border-radius:12px;padding:12px;background:#17253beF;color:white;font-weight:bold;font-size:13px;touch-action:none;box-shadow:0 3px 8px #0004}
button:active{filter:brightness(1.35)}
#controls{position:fixed;bottom:20px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;z-index:4}
#directions{display:flex;gap:9px}
.control{width:65px;height:66px;font-size:24px;background:#18253bdc;border:2px solid #ffffff70}
#pedals{display:flex;gap:10px}
.pedal{width:76px;height:88px;font-size:14px;border:2px solid #ffffff80;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.pedal span{font-size:25px}
#gas{background:linear-gradient(#24c665,#08763b)}
#brake{background:linear-gradient(#ff5e55,#a71919)}
#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06101bc9;color:white;text-align:center;z-index:10;padding:22px}
#card{max-width:340px;padding:25px;background:#17243a;border-radius:22px;border:1px solid #ffffff40}
h1{color:#ffdc43;font-size:27px}
#start{background:#20b960;font-size:17px;padding:15px 28px;margin-top:12px}
@media(max-width:370px){.box{padding:8px;font-size:11px}.val{font-size:16px}.control{width:55px;height:60px}.pedal{width:67px;height:80px}}
</style>
</head>
<body>

<div id="hud">
 <div class="box">SPEED<div class="val"><span id="speed">0</span> km/h</div></div>
 <div class="box">DISTANCE<div class="val"><span id="distance">0</span> m</div></div>
</div>

<div id="top">
 <button id="view">👀 OUTSIDE VIEW</button>
 <button id="sound">🔊 SOUND: ON</button>
</div>

<div id="controls">
 <div id="directions">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div id="pedals">
  <button class="pedal" id="brake"><span>🛑</span>BRAKE</button>
  <button class="pedal" id="gas"><span>🏁</span>GAS</button>
 </div>
</div>

<div id="message">
 <div id="card">
  <h1>🏎️ CAR RACING</h1>
  <p>Drive your car, use the brakes and enjoy the engine sound!</p>
  <p>🔊 Engine sound<br>🛑 Brake sound<br>👀 Inside & outside camera<br>📱 Mobile controls</p>
  <button id="start">START GAME ▶</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83c9ff);
scene.fog=new THREE.Fog(0x83c9ff,90,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x53633f,2));
const sun=new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(-8,18,8);
sun.castShadow=true;
scene.add(sun);

function mat(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const roadMat=mat(0x343941),grassMat=mat(0x459b42);
const whiteMat=mat(0xffffff),redMat=mat(0xd7192d,.3,.2);
const blackMat=mat(0x15191f),glassMat=mat(0x64c9ed,.25,.1);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.13,-130);
scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(12,450),roadMat);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.05,-170);
road.receiveShadow=true;
scene.add(road);

for(const x of [-5.6,5.6]){
 const edge=new THREE.Mesh(new THREE.BoxGeometry(.15,.04,450),whiteMat);
 edge.position.set(x,.01,-170);
 scene.add(edge);
}

const dashes=[];
for(let i=0;i<35;i++){
 const d=new THREE.Mesh(new THREE.BoxGeometry(.13,.035,3.3),whiteMat);
 d.position.set(0,.015,-i*12-5);
 scene.add(d);
 dashes.push(d);
}

const scenery=[];
const trunkMat=mat(0x75502c),leafMat=mat(0x176b35);
for(let i=0;i<55;i++){
 for(const side of [-1,1]){
  const z=-i*8-10,x=side*(8+Math.random()*8);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,1.7,7),trunkMat);
  trunk.position.set(x,.8,z);
  scene.add(trunk);
  const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.15,3.2,8),leafMat);
  leaves.position.set(x,2.9,z);
  scene.add(leaves);
  scenery.push({parts:[trunk,leaves],z,side});
 }
}

// Car
const car=new THREE.Group();
scene.add(car);
car.position.set(0,0,3);

const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.58,3.65),redMat);
body.position.y=.68;
body.castShadow=true;
car.add(body);

const hood=new THREE.Mesh(new THREE.BoxGeometry(1.75,.22,1),redMat);
hood.position.set(0,.98,-1.05);
car.add(hood);

const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.48,.72,1.65),glassMat);
cabin.position.set(0,1.25,.15);
car.add(cabin);

const roof=new THREE.Mesh(new THREE.BoxGeometry(1.43,.13,1.15),redMat);
roof.position.set(0,1.66,.12);
car.add(roof);

const wheels=[];
for(const x of [-1,1]){
 for(const z of [-1.15,1.18]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.25,20),blackMat);
  w.rotation.z=Math.PI/2;
  w.position.set(x,.39,z);
  car.add(w);
  wheels.push(w);

  const hub=new THREE.Mesh(
   new THREE.CylinderGeometry(.17,.17,.27,16),
   mat(0xc8cdd3,.3,.6)
  );
  hub.rotation.z=Math.PI/2;
  hub.position.set(x,.39,z);
  car.add(hub);
 }
}

for(const x of [-.65,.65]){
 const head=new THREE.Mesh(new THREE.BoxGeometry(.38,.16,.08),whiteMat);
 head.position.set(x,.86,-1.84);
 car.add(head);
 const tail=new THREE.Mesh(new THREE.BoxGeometry(.32,.15,.08),mat(0xff1717));
 tail.position.set(x,.82,1.84);
 car.add(tail);
}

// Controls
let speed=0,distance=0,gas=false,brake=false;
let left=false,right=false,inside=false,started=false,soundOn=true;
let lastBrake=false,previous=performance.now();

function hold(id,down,up){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  down();
 });
 const release=()=>up();
 el.addEventListener('pointerup',release);
 el.addEventListener('pointercancel',release);
 el.addEventListener('lostpointercapture',release);
}
hold('gas',()=>{gas=true;startAudio();},()=>gas=false);
hold('brake',()=>{brake=true;startAudio();},()=>brake=false);
hold('left',()=>{left=true;startAudio();},()=>left=false);
hold('right',()=>{right=true;startAudio();},()=>right=false);

const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
 startAudio();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{
 gas=false;brake=false;left=false;right=false;
 for(const k in keys)keys[k]=false;
});

document.getElementById('view').onclick=()=>{
 inside=!inside;
 document.getElementById('view').textContent=inside?'👀 INSIDE VIEW':'👀 OUTSIDE VIEW';
};

// Engine and braking audio
let audio=null,master=null,engineOsc=null,engineGain=null;
let brakeNoise=null,brakeGain=null;

function startAudio(){
 if(audio){
  if(audio.state==='suspended')audio.resume();
  return;
 }
 try{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain();
  master.gain.value=soundOn?.55:0;
  master.connect(audio.destination);

  engineOsc=audio.createOscillator();
  engineOsc.type='sawtooth';
  engineGain=audio.createGain();
  engineGain.gain.value=0;
  engineOsc.connect(engineGain);
  engineGain.connect(master);
  engineOsc.start();

  // Soft engine rumble
  const osc2=audio.createOscillator();
  const gain2=audio.createGain();
  osc2.type='triangle';
  osc2.frequency.value=42;
  gain2.gain.value=.012;
  osc2.connect(gain2);
  gain2.connect(master);
  osc2.start();

  brakeNoise=audio.createOscillator();
  brakeNoise.type='square';
  brakeNoise.frequency.value=170;
  brakeGain=audio.createGain();
  brakeGain.gain.value=0;
  brakeNoise.connect(brakeGain);
  brakeGain.connect(master);
  brakeNoise.start();
 }catch(e){}
}

function beep(freq,duration,volume){
 if(!soundOn)return;
 startAudio();
 if(!audio||!master)return;
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type='sine';
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 osc.connect(gain);
 gain.connect(master);
 osc.start();
 osc.stop(audio.currentTime+duration);
}

document.getElementById('sound').onclick=()=>{
 soundOn=!soundOn;
 document.getElementById('sound').textContent=soundOn?'🔊 SOUND: ON':'🔇 SOUND: OFF';
 if(soundOn)startAudio();
 if(master&&audio)master.gain.setTargetAtTime(soundOn?.55:0,audio.currentTime,.05);
};

document.getElementById('start').onclick=()=>{
 document.getElementById('message').style.display='none';
 started=true;
 startAudio();
};

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 if(started){
  const accelerate=gas||keys['arrowup']||keys['w'];
  const braking=brake||keys['arrowdown']||keys['s'];
  const steerL=left||keys['arrowleft']||keys['a'];
  const steerR=right||keys['arrowright']||keys['d'];

  if(accelerate)speed=Math.min(180,speed+48*dt);
  else speed=Math.max(0,speed-7*dt);

  if(braking)speed=Math.max(0,speed-100*dt);

  // Play a short braking squeal when brake is pressed
  if(braking&&!lastBrake)beep(190,.22,.18);
  lastBrake=braking;

  if(steerL)car.position.x-=Math.max(.035,speed*.00085)*60*dt;
  if(steerR)car.position.x+=Math.max(.035,speed*.00085)*60*dt;
  car.position.x=THREE.MathUtils.clamp(car.position.x,-4.4,4.4);
  car.rotation.z=steerL?.045:steerR?-.045:car.rotation.z*.9;

  wheels.forEach(w=>w.rotation.x+=speed*dt*.055);

  const move=speed*.14*dt;
  dashes.forEach(d=>{
   d.position.z+=move;
   if(d.position.z>8)d.position.z-=420;
  });

  scenery.forEach(s=>{
   s.z+=move;
   s.parts.forEach(p=>p.position.z+=move);
   if(s.z>10){
    s.z-=440;
    s.parts.forEach(p=>{
     p.position.x=s.side*(8+Math.random()*8);
    });
   }
  });

  distance+=speed*dt/3.6;
  document.getElementById('speed').textContent=Math.round(speed);
  document.getElementById('distance').textContent=Math.floor(distance);

  if(audio&&engineOsc&&engineGain){
   engineOsc.frequency.setTargetAtTime(45+speed*1.3,audio.currentTime,.07);
   engineGain.gain.setTargetAtTime(
    soundOn&&accelerate?.025:soundOn&&speed>1?.012:0,
    audio.currentTime,.09
   );
   if(brakeGain){
    brakeGain.gain.setTargetAtTime(soundOn&&braking?.018:0,audio.currentTime,.05);
    brakeNoise.frequency.setTargetAtTime(120+speed*2,audio.currentTime,.05);
   }
  }
 }

 if(inside){
  camera.position.set(car.position.x,1.55,car.position.z+.15);
  camera.lookAt(car.position.x,1.45,car.position.z-30);
 }else{
  camera.position.lerp(new THREE.Vector3(car.position.x,5.1,car.position.z+9.5),.09);
  camera.lookAt(car.position.x,.8,car.position.z-8);
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
