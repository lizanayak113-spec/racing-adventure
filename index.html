


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>City Car Racing 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.panel{background:#101b2be8;color:white;padding:10px 13px;border-radius:12px;font-size:12px;font-weight:bold}
.value{color:#ffdf36;font-size:19px;margin-top:4px}
#top{position:fixed;top:75px;left:12px;display:flex;gap:8px;z-index:4}
button{border:2px solid #ffffff70;border-radius:13px;color:white;font-weight:bold;background:#17243beF;padding:13px;font-size:13px;touch-action:none;box-shadow:0 4px 8px #0004}
button:active{filter:brightness(1.5);transform:scale(.96)}
#controls{position:fixed;left:12px;right:12px;bottom:18px;display:flex;justify-content:space-between;align-items:end;z-index:4}
#directions{display:flex;gap:9px}
.turn{width:65px;height:65px;font-size:25px;background:#1d2d45eF}
#pedals{display:flex;gap:9px}
.pedal{width:72px;height:85px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pedal span{font-size:24px}
#gas{background:linear-gradient(#20c968,#08783b)}
#brake{background:linear-gradient(#ff6156,#a91b1b)}
#message{position:fixed;inset:0;background:#071321cc;display:flex;align-items:center;justify-content:center;z-index:10;color:white;text-align:center;padding:22px}
#card{max-width:340px;background:#18263c;border:1px solid #ffffff50;border-radius:22px;padding:25px}
h1{color:#ffdc42}
#start{background:#19b85a;padding:15px 25px;font-size:17px;margin-top:12px}
#notice{position:fixed;top:132px;left:50%;transform:translateX(-50%);z-index:3;background:#101b2bc9;color:white;padding:7px 12px;border-radius:10px;font-size:12px;white-space:nowrap}
@media(max-width:370px){.panel{padding:8px}.turn{width:56px;height:60px}.pedal{width:63px;height:78px}}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">SPEED<div class="value"><span id="speed">0</span> km/h</div></div>
 <div class="panel">DISTANCE<div class="value"><span id="distance">0</span> m</div></div>
</div>

<div id="top">
 <button id="view">👀 OUTSIDE VIEW</button>
 <button id="sound">🔊 SOUND: ON</button>
</div>

<div id="notice">Avoid the oncoming cars!</div>

<div id="controls">
 <div id="directions">
  <button class="turn" id="left">⬅️</button>
  <button class="turn" id="right">➡️</button>
 </div>
 <div id="pedals">
  <button class="pedal" id="brake"><span>🛑</span>BRAKE</button>
  <button class="pedal" id="gas"><span>🏁</span>GAS</button>
 </div>
</div>

<div id="message">
 <div id="card">
  <h1>🏎️ CITY RACING 3D</h1>
  <p>Drive through the city, dodge traffic and enjoy the engine sound!</p>
  <p>⬅️ ➡️ Move your car<br>🏁 GAS to accelerate<br>🛑 BRAKE to slow down<br>🏙️ City buildings and traffic</p>
  <button id="start">START GAME ▶</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,100,280);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x59624a,2));
const sun=new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(-10,20,10);
sun.castShadow=true;
scene.add(sun);

function mat(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

const grassMat=mat(0x479b45);
const roadMat=mat(0x34373d);
const whiteMat=mat(0xffffff);
const buildingColors=[0xc7c3bb,0xd9bda0,0xaabac7,0xe0d5c6,0xb6a5b9,0xd0d0c6];

const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.16,-160);
scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(14,500),roadMat);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.06,-180);
scene.add(road);

for(const x of [-6.7,6.7]){
 const edge=new THREE.Mesh(new THREE.BoxGeometry(.16,.04,500),whiteMat);
 edge.position.set(x,.01,-180);
 scene.add(edge);
}

// Broken white road markings
const dashes=[];
for(let i=0;i<42;i++){
 const dash=new THREE.Mesh(new THREE.BoxGeometry(.14,.04,3.5),whiteMat);
 dash.position.set(0,.015,-i*12);
 scene.add(dash);
 dashes.push(dash);
}

// City buildings with windows
const buildings=[];
const windowMat=new THREE.MeshStandardMaterial({
 color:0x8bd7f5,emissive:0x17445a,roughness:.35
});
const darkWindow=mat(0x394b5b,.3);

function makeBuilding(x,z,side){
 const group=new THREE.Group();
 const width=3+Math.random()*3;
 const height=7+Math.random()*18;
 const depth=4+Math.random()*4;
 const color=buildingColors[Math.floor(Math.random()*buildingColors.length)];
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(width,height,depth),mat(color)
 );
 body.position.y=height/2;
 group.add(body);

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(width+.15,.22,depth+.15),mat(0x565b61)
 );
 roof.position.y=height+.08;
 group.add(roof);

 const rows=Math.min(9,Math.floor(height/2.1));
 const cols=Math.max(2,Math.floor(width/1.05));
 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   const win=new THREE.Mesh(
    new THREE.BoxGeometry(.48,.7,.045),
    Math.random()>.18?windowMat:darkWindow
   );
   win.position.set(
    -width/2+(c+.5)*width/cols,
    1.1+r*1.65,
    depth/2+.025
   );
   group.add(win);
  }
 }
 group.position.set(x,0,z);
 scene.add(group);
 buildings.push({group,z,side});
}

for(let i=0;i<28;i++){
 makeBuilding(-12-Math.random()*3,-i*15-10,-1);
 makeBuilding(12+Math.random()*3,-i*15-10,1);
}

// Car construction
function makeCar(color){
 const car=new THREE.Group();
 const bodyMat=mat(color,.3,.2);
 const glassMat=new THREE.MeshStandardMaterial({
  color:0x73c9ec,roughness:.23,metalness:.1
 });

 const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,.62,3.5),bodyMat);
 body.position.y=.72;
 body.castShadow=true;
 car.add(body);

 const hood=new THREE.Mesh(new THREE.BoxGeometry(1.65,.22,.9),bodyMat);
 hood.position.set(0,1.02,-1.05);
 car.add(hood);

 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.35,.72,1.55),glassMat);
 cabin.position.set(0,1.34,.15);
 car.add(cabin);

 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.28,.12,1.1),bodyMat);
 roof.position.set(0,1.72,.15);
 car.add(roof);

 for(const x of [-.63,.63]){
  const head=new THREE.Mesh(new THREE.BoxGeometry(.35,.14,.07),whiteMat);
  head.position.set(x,.9,-1.78);
  car.add(head);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(.3,.15,.07),mat(0xff1515));
  tail.position.set(x,.87,1.78);
  car.add(tail);
 }

 const wheels=[];
 for(const x of [-.94,.94]){
  for(const z of [-1.1,1.1]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.35,.35,.23,18),mat(0x17191d)
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.38,z);
   car.add(wheel);
   wheels.push(wheel);
  }
 }
 car.userData.wheels=wheels;
 scene.add(car);
 return car;
}

const player=makeCar(0xd7192d);
player.position.set(0,0,5);

const traffic=[];
const trafficColors=[0xffc928,0x2377db,0xffffff,0x19a96b,0xe55b28,0x9d70dd];

function spawnTraffic(index){
 const car=makeCar(trafficColors[Math.floor(Math.random()*trafficColors.length)]);
 car.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-65-index*30);
 car.userData.lane=car.position.x;
 car.userData.speed=12+Math.random()*12;
 traffic.push(car);
}
for(let i=0;i<7;i++)spawnTraffic(i);

// Sound: engine hum and brake sound
let audio=null,master=null,engineOsc=null,engineGain=null;
let brakeOsc=null,brakeGain=null;
let soundOn=true;

function startAudio(){
 if(audio){
  if(audio.state==='suspended')audio.resume();
  return;
 }
 try{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain();
  master.gain.value=soundOn?.55:0;
  master.connect(audio.destination);

  engineOsc=audio.createOscillator();
  engineOsc.type='sawtooth';
  engineOsc.frequency.value=55;
  engineGain=audio.createGain();
  engineGain.gain.value=.001;
  engineOsc.connect(engineGain);
  engineGain.connect(master);
  engineOsc.start();

  brakeOsc=audio.createOscillator();
  brakeOsc.type='triangle';
  brakeOsc.frequency.value=180;
  brakeGain=audio.createGain();
  brakeGain.gain.value=0;
  brakeOsc.connect(brakeGain);
  brakeGain.connect(master);
  brakeOsc.start();
 }catch(e){}
}

function beep(freq,duration,volume){
 if(!soundOn)return;
 startAudio();
 if(!audio)return;
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type='sine';
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 osc.connect(gain);
 gain.connect(master);
 osc.start();
 osc.stop(audio.currentTime+duration);
}

// Mobile hold controls
let gas=false,brake=false,left=false,right=false;
function hold(id,down,up){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  down();
  startAudio();
 });
 const release=()=>up();
 el.addEventListener('pointerup',release);
 el.addEventListener('pointercancel',release);
 el.addEventListener('lostpointercapture',release);
}
hold('gas',()=>gas=true,()=>gas=false);
hold('brake',()=>brake=true,()=>brake=false);
hold('left',()=>left=true,()=>left=false);
hold('right',()=>right=true,()=>right=false);

const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 startAudio();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{
 gas=false;brake=false;left=false;right=false;
 for(const k in keys)keys[k]=false;
});

let inside=false,started=false,lastBrake=false;
document.getElementById('view').onclick=()=>{
 inside=!inside;
 document.getElementById('view').textContent=
  inside?'👀 INSIDE VIEW':'👀 OUTSIDE VIEW';
};
document.getElementById('sound').onclick=()=>{
 soundOn=!soundOn;
 document.getElementById('sound').textContent=
  soundOn?'🔊 SOUND: ON':'🔇 SOUND: OFF';
 if(soundOn)startAudio();
 if(master&&audio)master.gain.setTargetAtTime(soundOn?.55:0,audio.currentTime,.05);
};
document.getElementById('start').onclick=()=>{
 document.getElementById('message').style.display='none';
 started=true;
 startAudio();
};

let speed=0,distance=0,previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 if(started){
  const accelerating=gas||keys['arrowup']||keys['w'];
  const braking=brake||keys['arrowdown']||keys['s'];
  const goLeft=left||keys['arrowleft']||keys['a'];
  const goRight=right||keys['arrowright']||keys['d'];

  if(accelerating)speed=Math.min(160,speed+38*dt);
  else speed=Math.max(0,speed-5*dt);
  if(braking)speed=Math.max(0,speed-85*dt);

  if(goLeft)player.position.x-=5.2*dt;
  if(goRight)player.position.x+=5.2*dt;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-4.8,4.8);
  player.rotation.z=goLeft?.055:goRight?-.055:player.rotation.z*.88;

  player.userData.wheels.forEach(w=>w.rotation.x+=speed*dt*.045);

  // Road and city move towards the player
  const movement=speed*.19*dt;
  dashes.forEach(d=>{
   d.position.z+=movement;
   if(d.position.z>10)d.position.z-=504;
  });

  buildings.forEach(b=>{
   b.z+=movement;
   b.group.position.z+=movement;
   if(b.z>20){
    b.z-=450;
    b.group.position.z=b.z;
    b.group.position.x=b.side*(12+Math.random()*3);
   }
  });

  // Traffic comes towards the player
  for(const t of traffic){
   t.position.z+=(movement+t.userData.speed*dt);
   t.userData.wheels.forEach(w=>w.rotation.x+=speed*dt*.04);

   // Collision: slow the car down and move traffic away
   if(Math.abs(t.position.z-player.position.z)<2.6&&
      Math.abs(t.position.x-player.position.x)<1.7){
    speed=Math.max(0,speed-65*dt-8);
    t.position.z=-100-Math.random()*100;
    beep(100,.35,.25);
   }
   if(t.position.z>13){
    t.position.z=-150-Math.random()*120;
    t.position.x=[-4,0,4][Math.floor(Math.random()*3)];
   }
  }

  distance+=speed*dt/3.6;
  document.getElementById('speed').textContent=Math.round(speed);
  document.getElementById('distance').textContent=Math.floor(distance);

  if(audio&&engineOsc&&engineGain){
   engineOsc.frequency.setTargetAtTime(45+speed*1.1,audio.currentTime,.08);
   engineGain.gain.setTargetAtTime(
    soundOn&&speed>1?(accelerating?.025:.012):.001,
    audio.currentTime,.1
   );
   if(brakeGain){
    brakeGain.gain.setTargetAtTime(soundOn&&braking?.025:0,audio.currentTime,.05);
    brakeOsc.frequency.setTargetAtTime(140+speed*2,audio.currentTime,.05);
   }
  }

  if(braking&&!lastBrake)beep(170,.2,.14);
  lastBrake=braking;
 }

 if(inside){
  camera.position.set(player.position.x,1.55,player.position.z+.1);
  camera.lookAt(player.position.x,1.45,player.position.z-30);
 }else{
  camera.position.lerp(
   new THREE.Vector3(player.position.x,5.5,player.position.z+10),.09
  );
  camera.lookAt(player.position.x,.8,player.position.z-9);
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
